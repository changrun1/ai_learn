version: '3.9'
services:
  server:
    build: ./server
    container_name: ai_learn_server
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./server/uploads:/app/server/uploads
    networks:
      - ai_learn_net
  frontend:
    build: ./app
    container_name: ai_learn_frontend
    env_file: .env
    environment:
      - VUE_APP_API_BASE_URL=http://server:3000
    ports:
      - "8080:8080"
    depends_on:
      - server
    networks:
      - ai_learn_net
networks:
  ai_learn_net:
    driver: bridge
